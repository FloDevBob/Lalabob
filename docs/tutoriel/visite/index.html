<!-- Visite guidée de Lalabob. La copie de la fenêtre occupe tout l'écran ; l'élément à utiliser est mis en lumière, le
     reste assombri, et une bulle le suit (consigne, résultat, Suivant). Même page dans l'app (Aide ▸ Visite guidée,
     embarquée : sans Internet) et en ligne. La copie suit la vraie fenêtre (capture du 27/11/2026, 1320 × 752) : quand
     l'interface change, cette copie doit suivre. Vocabulaire : docs/LEXIQUE.md. Sons : sons.js

<style>

.out { height: 24px; padding: 0 10px; border-radius: 6px; background: rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px; font-size: 13px; width: 180px; justify-content: space-between; }
.pair { color: #5D606A; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.lockb { height: 28px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--soft); }
.lockb.open { color: var(--accent); background: rgba(255,201,61,.1); }
.stopall { height: 26px; padding: 0 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14) !important; display: flex; align-items: center; gap: 8px; font-size: 13.5px; }

.stopall b { width: 12px; height: 12px; border: 1.6px solid currentColor; border-radius: 3px; }
.grid { position: absolute; left: 20px; top: 70px; width: 1280px; display: grid; grid-template-columns: repeat(8, 153px); column-gap: 8px; transition: left .3s cubic-bezier(.2,.8,.2,1); }
.ch { height: 28px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid rgba(255,255,255,.06); margin-bottom: 7px; }

.ch.light .ico { background: rgba(255,201,61,.14); color: var(--accent); }

.pad.empty.drop { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.04); }

.cards { position: absolute; left: 20px; top: 462px; width: 1280px; display: grid; grid-template-columns: repeat(8, 153px); column-gap: 8px; transition: left .3s cubic-bezier(.2,.8,.2,1); }

.meter i b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(to top, #3DDC6E 0 82%, #FFC93D 82% 96%, #FF5C66 96%); background-size: 100% 62px; background-position: bottom; }
.knob { position: absolute; left: 92px; top: 6px; width: 34px; height: 34px; cursor: grab; }
.knob svg { display: block; }
.klab { position: absolute; left: 76px; top: 42px; width: 66px; text-align: center; font-size: 11px; font-weight: 600; color: var(--soft); line-height: 1.15; }
.db { position: absolute; left: 10px; bottom: 6px; width: 70px; text-align: center; font: 12px var(--mono); color: var(--soft); }

.cstop b { width: 10px; height: 10px; border-radius: 2px; background: #fff; }
.card.lt .fader { left: 50px; }
.card.lt .sun { position: absolute; left: 92px; top: 12px; color: var(--accent); }
.card.lt .db { left: 0; width: 100%; }
.bottom { position: absolute; left: 0; right: 0; top: 556px; height: 196px; border-top: 1px solid var(--hair); background: var(--chrome); }
.idle { padding: 0 20px; }
.idle .msg { height: 50px; display: flex; align-items: center; color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--hair); margin: 0 -20px; padding: 0 20px; }
.idle .ind { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 12px; padding-top: 14px; }
.idle .ind > div { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 14px; height: 112px; font-size: 12px; color: var(--soft); }
.idle .ind small { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.idle .ind strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }
.tip { display: flex; gap: 12px; align-items: flex-start; }
.tip .bulb { flex: none; width: 34px; height: 34px; border-radius: 8px; background: rgba(255,201,61,.12); display: grid; place-items: center; color: var(--accent); }
.insp .top { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.cap { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 6px; border-radius: 23px; background: rgba(0,0,0,.35); }
.cap .pl { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.cap .sm { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--soft); }
.cap .sm.on { color: var(--accent); background: rgba(255,201,61,.14); }
.cap .lp.on { color: var(--ok); background: rgba(61,220,110,.12); }
.cap .sep { width: 1px; height: 22px; background: var(--hair); }
.time { font: 13px var(--mono); color: var(--soft); padding-right: 14px; border-right: 1px solid var(--hair); }
.insp .ttl { font-weight: 700; font-size: 15px; } .insp .ttl small { font-weight: 400; color: var(--soft); font-size: 12.5px; margin-left: 6px; }
.insp .file { margin-left: auto; font: 11.5px var(--mono); color: var(--dim); }
.insp .dot { width: 16px; height: 16px; border-radius: 5px; }
.insp .low { position: absolute; left: 0; right: 0; top: 53px; bottom: 0; display: flex; gap: 12px; padding: 10px 16px 12px 14px; }
.gauge { width: 46px; flex: none; border-radius: 10px; background: var(--well); border: 1px solid var(--hair); position: relative; }
.gauge::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 26px; width: 4px; border-radius: 2px; background: #3A3D45; }
.gauge b { position: absolute; left: 8px; width: 30px; height: 8px; border-radius: 4px; background: #E8E9EC; top: 18px; }
.gauge span { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: 10.5px var(--mono); color: var(--soft); }
.wave { position: relative; flex: 1; border-radius: 10px; background: var(--well); border: 1px solid var(--hair); overflow: hidden; }
.wave canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.wave .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; left: 0; }
.lib { position: absolute; left: 0; top: 56px; width: 272px; height: 500px; background: var(--chrome); border-right: 1px solid var(--hair); padding: 12px; transform: translateX(-280px); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 5; }
.lib.on { transform: none; }
.lib .search { height: 30px; border-radius: 8px; background: rgba(255,255,255,.06); color: var(--dim); display: flex; align-items: center; padding: 0 10px; font-size: 13px; margin-bottom: 12px; }
.lib h5 { margin: 4px 4px 6px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.lib .it { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: 8px; font-size: 13px; cursor: grab; }
.lib .it:hover { background: rgba(255,255,255,.05); }
.lib .it .w { color: var(--v, #5B8CFF); }
.lib .it .nmf { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .it .d { margin-left: auto; font: 11.5px var(--mono); color: var(--dim); }
.lib .it .u { width: 6px; height: 6px; border-radius: 50%; background: #2CCFC0; }
.lib .foot { position: absolute; left: 12px; right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; text-align: center; }
.drag { position: fixed; z-index: 70; pointer-events: none; padding: 6px 12px; border-radius: 10px; background: #22479E; color: #DCE5FF; font-weight: 600; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.5); transform: translate(-50%, -50%); }

.pad.lit { box-shadow: inset 0 0 0 2px var(--v), 0 0 16px -2px var(--v); }
.pad.lit .pb { background: var(--v); color: #111; }
.pad.light .pb { color: var(--accent); }
.pad.light.lit .pb { color: #111; }
.card.lt .fader { left: 44px; cursor: grab; }
.card.lt .sun { position: absolute; left: 92px; top: 14px; color: var(--accent); }
.card.lt .db { left: 0; width: 100%; font: 12px var(--ui); }
.toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 30; background: #2A2C33; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; animation: vg-up .25s both; white-space: nowrap; }
@keyframes vg-up { from { opacity: 0; transform: translate(-50%, 6px); } }

/* Mise en lumière : un trou dans le voile sombre, cerclé d'ambre tant que le geste est à faire */
.vg-spot { position: fixed; z-index: 40; pointer-events: none; border-radius: 12px; box-shadow: 0 0 0 200vmax rgba(4,5,7,.62); transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1), height .35s cubic-bezier(.2,.8,.2,1); }

/* La bulle */
.vg-bubble { position: fixed; z-index: 60; width: 330px; background: #1D1F25; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 14px 16px 12px; box-shadow: 0 18px 50px rgba(0,0,0,.55); transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1); }

.vg-apc i { width: 13px; height: 13px; border-radius: 3px; background: #2A2C33; }

.vg-ghost.tap { animation: vg-tap .3s ease-out; } @keyframes vg-tap { 50% { transform: scale(.75); } }

@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>

<div class="vg-spot" id="vg-spot"></div>
<div class="vg-bubble" id="vg-bubble" role="dialog" aria-live="polite"></div>
<svg class="vg-ghost" id="vg-ghost" hidden viewBox="0 0 22 22"><path d="M3 2l15 8-6.5 1.8L9 18z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>
<script src="sons.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tour);
const mmss = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Teintes de l'app (LalabobModel/Tint.swift) : fond, texte, couleur vive
const TINT = { azur: ['#22479E', '#DCE5FF', '#5B8CFF'], orange: ['#8F4317', '#FFE6D4', '#FF8A3D'], violet: ['#5530A0', '#E8DEFF', '#A57CFF'],
  rose: ['#8C2558', '#FFDDEB', '#FF5CA8'], ambre: ['#755A0E', '#FFF2C7', '#FFC93D'], rouge: ['#8C2B32', '#FFE1E2', '#FF5C66'],
  blanc: ['#4A4D55', '#F4F5F7', '#F4F5F7'], graphite: ['#30333A', '#D3D6DD', '#9A9EA8'] };
// La grille « Découverte » du spectacle d'entraînement. snd : son joué par la visite (les autres pads restent muets ici).
const P = (t, s, snd, loop) => ({ t, s, snd, loop: !!loop });
const L = (t, s, tint, noir) => ({ t, s, tint, light: 1, noir: !!noir });

    if (STEPS[cur] !== s) return;
    tap(g);
    fromGhost = true;
    if (s.demo) s.demo();
    else if (s.dbl) { const id = el.dataset.pad; act('select', id); later(() => { tap(g); fromGhost = true; act('play', id); fromGhost = false; }, 220); }
    else act(el.dataset.act);
    fromGhost = false;

}
function moveGhost(g, x, y, jump) { g.hidden = false; if (jump) g.style.transition = 'none'; g.style.left = x + 'px'; g.style.top = y + 'px'; if (jump) { void g.offsetWidth; g.style.transition = ''; } }

// Glisser « Applaudissements » sur la première case de « À vous »
function dragDemo() {
  const g = $('#vg-ghost'), cell = $('[data-cell="5-0"]'); if (!cell) return;

  g.style.transitionDuration = '1.1s';
  later(() => { chip.style.left = to.left + to.width / 2 + 'px'; chip.style.top = to.top + to.height / 2 + 'px'; moveGhost(g, to.left + to.width / 2, to.top + to.height / 2); }, 30);
  later(() => { chip.remove(); g.style.transitionDuration = ''; fromGhost = true; act('drop', { cell: '5-0', snd: 'applaudissements', name: 'Applaudissements' }); fromGhost = false; }, 1200);
}

window.addEventListener('resize', () => { cam(); place(true); });
if (window.ResizeObserver) new ResizeObserver(() => { cam(); place(true); }).observe($('#vg-view'));
window.lalabobVisite = { act, go, count: () => STEPS.length, state: () => S, step: () => cur };
let start = 0;
try { start = Math.min(STEPS.length - 1, Math.max(0, parseInt(localStorage.getItem('lalabob-visite-v2'), 10) || 0)); } catch (e) {}
cam(); go(start); loop(); tick();
})();
