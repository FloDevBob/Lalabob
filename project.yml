# Définition du projet Xcode (XcodeGen). Ne modifiez pas Lalabob.xcodeproj à la main :
# éditez ce fichier puis lancez `make project`.
name: Lalabob

options:
  bundleIdPrefix: fr.flodevbob
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  LalabobKit:
    path: Packages/LalabobKit

targets:
  Lalabob:
    type: application
    platform: macOS
    sources:
      - path: App
      # Visite guidée (page HTML + sons, la même que celle publiée en ligne) et spectacle d'entraînement,
      # copiés tels quels dans l'app (dossier « visite » et paquet Entrainement.lalabob).
      - path: docs/tutoriel/visite
        type: folder
        buildPhase: resources
      - path: docs/tutoriel/Entrainement.lalabob
        type: folder
        buildPhase: resources
    dependencies:
      - package: LalabobKit
        product: LalabobModel
      - package: LalabobKit
        product: LalabobEngine
      - package: LalabobKit
        product: LalabobDesign
    entitlements:
      path: App/Lalabob.entitlements
      properties:
        # Sandbox : l'app n'accède qu'aux fichiers choisis par l'utilisateur.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Grilles Apple Music : recherche dans le catalogue, extraits de 30 s et pochettes (adresses d'Apple seulement).
        com.apple.security.network.client: true
        # Le 9e fader de l'APC règle le volume d'Apple Music (Apple Events vers Music seulement, ADR 0009).
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events: [com.apple.Music]
        # Groupes d'accès déclarés par Music (com.apple.Music.sdef) : la voie prévue pour une app sandboxée.
        # Lumière en DMX (ADR 0012) : boîtier USB-DMX vu comme un port série (/dev/cu.usbserial-…).
        com.apple.security.device.serial: true
        com.apple.security.scripting-targets:
          com.apple.Music: [com.apple.Music.playback, com.apple.Music.library.read, com.apple.Music.library.read-write]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lalabob
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Lalabob"
        NSAudioCaptureUsageDescription: "Lalabob fait passer le son d'Apple Music par ses colonnes (volume, filtre, vumètre, sortie choisie). Rien n'est enregistré."
        NSAppleEventsUsageDescription: Lalabob règle le volume d'Apple Music avec le 9e fader de l'APC mini mk2.
        # Document .lalabob : un paquet (dossier) avec show.json et Audio/.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: fr.flodevbob.lalabob.show
            UTTypeDescription: Spectacle Lalabob
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lalabob]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Spectacle Lalabob
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [fr.flodevbob.lalabob.show]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.flodevbob.lalabob
        PRODUCT_NAME: Lalabob
        # Signature : valeurs définies dans Config/Base.xcconfig (locale, sans compte Apple)
        # et surchargeables dans Config/Local.xcconfig.
        CODE_SIGN_STYLE: $(LALABOB_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(LALABOB_SIGN_IDENTITY)
        "CODE_SIGN_IDENTITY[sdk=macosx*]": $(LALABOB_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(LALABOB_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Lalabob:
    build:
      targets:
        Lalabob: all
    run:
      config: Debug
    archive:
      config: Release
