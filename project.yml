# Définition du projet Xcode (XcodeGen). Ne modifiez pas Lalabob.xcodeproj à la main :
# éditez ce fichier puis lancez `make project`.
name: Lalabob

options:
  bundleIdPrefix: fr.flodevbob
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  LalabobKit:
    path: Packages/LalabobKit

targets:
  Lalabob:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LalabobKit
        product: LalabobModel
      - package: LalabobKit
        product: LalabobEngine
      - package: LalabobKit
        product: LalabobDesign
    entitlements:
      path: App/Lalabob.entitlements
      properties:
        # Sandbox : l'app n'accède qu'aux fichiers choisis par l'utilisateur.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lalabob
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Lalabob"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.flodevbob.lalabob
        PRODUCT_NAME: Lalabob
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Lalabob:
    build:
      targets:
        Lalabob: all
    run:
      config: Debug
    archive:
      config: Release
